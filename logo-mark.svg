<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Revive the Shine">
  <title>Revive the Shine</title>
  <defs>
    <linearGradient id="rtsGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e6c97a"/>
      <stop offset="1" stop-color="#c9a84c"/>
    </linearGradient>
  </defs>
  <!-- outer badge ring, gap at top-right for the shine glint -->
  <path
    d="M32 5.5a26.5 26.5 0 1 0 22.9 13.2"
    fill="none"
    stroke="url(#rtsGold)"
    stroke-width="3.2"
    stroke-linecap="round"
  />
  <!-- revived carpet fibres: three tapering pile strokes -->
  <g fill="none" stroke="url(#rtsGold)" stroke-width="3.4" stroke-linecap="round">
    <path d="M23 44.5V33.5a3.6 3.6 0 0 1 7.2 0v11"/>
    <path d="M33.8 44.5V26.5a3.6 3.6 0 0 1 7.2 0v18"/>
  </g>
  <!-- baseline -->
  <path d="M19.5 47.5h25" fill="none" stroke="url(#rtsGold)" stroke-width="3.2" stroke-linecap="round"/>
  <!-- shine glint -->
  <path
    d="M52.5 9.5c.7 3.1 1.4 3.8 4.5 4.5-3.1.7-3.8 1.4-4.5 4.5-.7-3.1-1.4-3.8-4.5-4.5 3.1-.7 3.8-1.4 4.5-4.5z"
    fill="url(#rtsGold)"
  />
</svg>
